name: CI/CD Pipeline

on:
  push:
    branches: [main, v4/quality]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # --- P1-04: fail fast if a stray schema file reappears next to schema.prisma.
  # backend/prisma/schema_fixed.prisma and temp_schema.txt were both found to be
  # stale, already-superseded snapshots left over from past manual schema edits
  # made outside the migration pipeline — the kind of file that causes a future
  # engineer to edit the wrong copy. This keeps schema.prisma + migrations/ as
  # the only source of truth going forward.
  schema-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for stray schema-adjacent files
        run: |
          STRAY=$(find backend/prisma -maxdepth 1 -type f \
            \( -name "*.prisma" -o -name "*.txt" \) \
            ! -name "schema.prisma" )
          if [ -n "$STRAY" ]; then
            echo "Found stray schema file(s) outside the migration pipeline:"
            echo "$STRAY"
            echo "backend/prisma/schema.prisma is the only schema file that belongs here; real changes go through a migration under backend/prisma/migrations/."
            exit 1
          fi

  # --- Build & test the shared common package first ---
  build-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install common dependencies
        run: cd common && npm ci

  # --- Backend: lint, test, build ---
  test-backend:
    needs: [build-common]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          cd common && npm ci
          cd ../backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Run database migrations
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Build backend
        run: cd backend && npm run build

      - name: Run unit tests (with coverage gate — P1-03)
        run: cd backend && npm test -- --passWithNoTests --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-that-is-at-least-32-characters
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          PORT: 3000
          NODE_ENV: test
          FRONTEND_URL: http://localhost:5173

      - name: Run integration tests (wallet, auth, payments)
        run: cd backend && npm run test:integration -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-that-is-at-least-32-characters
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          PORT: 3000
          NODE_ENV: test
          FRONTEND_URL: http://localhost:5173
          # EMG-02 made these mandatory for webhook signature verification —
          # without them, payment webhook integration tests can't run at all.
          PAYSTACK_SECRET_KEY: sk_test_ci_dummy_secret_key_for_hmac_signing
          FLUTTERWAVE_SECRET_HASH: ci_dummy_flutterwave_secret_hash
          # P1-03: a single test file legitimately issues far more than the
          # default 10 auth requests/min across its `it` blocks.
          THROTTLE_AUTH_LIMIT: '1000'
          THROTTLE_DEFAULT_LIMIT: '1000'
          # db-relationships.integration.spec.ts (52 FK/cascade assertions)
          # self-skips unless explicitly opted in — CI has a real Postgres,
          # so opt in rather than silently skipping real coverage.
          RUN_INTEGRATION_TESTS: '1'

  # --- Frontend: lint, typecheck, test, build ---
  test-frontend:
    needs: [build-common]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          cd common && npm ci
          cd ../frontend && npm ci

      - name: TypeScript type check
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:3000/api
          VITE_DEMO_MODE: 'true'

      - name: Run tests
        run: cd frontend && npm run test:run -- --passWithNoTests
        continue-on-error: true

  # --- Security: npm audit ---
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # P3-03: real npm audit --workspaces, no longer double-suppressed with
      # `|| true` (which made the step report success unconditionally,
      # hiding the actual result even from the job's own annotations).
      # continue-on-error still keeps this non-blocking for now — there are
      # 87 pre-existing high/critical vulnerabilities to triage first (see
      # ProBacklog-v1.md P3-03) — but the real pass/fail is now visible in
      # the Actions UI instead of silently discarded.
      - name: Audit dependencies (high/critical)
        run: npm audit --workspaces --audit-level=high
        continue-on-error: true

  # --- Deploy to EC2 (main branch only) ---
  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          # Secrets configured in GitHub repository settings
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/ifa_app

            # Create pre-deploy backup
            ./scripts/backup-db.sh

            # Pull and deploy
            ./scripts/deploy.sh

            # Verify health
            sleep 5
            curl -sf http://localhost:3000/api/health || echo "WARNING: Health check failed"

      - name: Verify deployment
        if: success()
        run: |
          echo "Deployment to production complete"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
