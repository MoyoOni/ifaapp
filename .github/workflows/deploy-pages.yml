name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ ifaapp ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build frontend
        run: npm --prefix frontend run build
        env:
          VITE_APP_TITLE: "Ìlú Àṣẹ - Digital Nexus"
          VITE_API_URL: "https://api.moyooni.com"  # Update to your API URL
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: "/ifaapp/"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: other

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
