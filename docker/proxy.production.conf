# Production edge proxy (the `proxy` service in /home/ubuntu/app/docker-compose.yml,
# mounted at /etc/nginx/conf.d/default.conf). Kept in the repo since November 2,
# 2026; before that it existed only on the box.
#
# `resolver` + `server ... resolve` (nginx >= 1.27.3) re-resolve the backend and
# frontend container names through Docker's DNS. Without them nginx resolved
# `backend` once at startup, so every deploy that recreated the backend
# container 502'd all of /api/* until the proxy was reloaded (October 31, 2026).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8080 resolve;
}
upstream frontend {
    zone frontend 64k;
    server nginx:80 resolve;
}

server {
    listen 8090;
    server_name _;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
