version: '3.8'

services:
  # PostgreSQL 16 - Production database
  postgres:
    image: postgres:16-alpine
    container_name: ilu-ase-production-postgres
    environment:
      POSTGRES_DB: ilu_ase_production
      POSTGRES_USER: production_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production_user -d ilu_ase_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - production-network
    restart: unless-stopped
    # Security configurations
    security_opt:
      - no-new-privileges:true
    # Resource limitations
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Redis - Production cache & session store
  redis:
    image: redis:7-alpine
    container_name: ilu-ase-production-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - production-network
    restart: unless-stopped
    # Security configurations
    security_opt:
      - no-new-privileges:true
    # Resource limitations
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Backend API - Production NestJS server
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    container_name: ilu-ase-production-backend
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://production_user:${POSTGRES_PASSWORD}@postgres:5432/ilu_ase_production?schema=public&connection_limit=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: 3600
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: production
      SENTRY_TRACE_SAMPLE_RATE: "0.1"
      LOG_LEVEL: warn
      API_URL: http://backend:8080
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WEBSOCKET_URL: ws://backend:8080
      WEBSOCKET_CORS_ORIGIN: ${FRONTEND_URL}
      ENABLE_SWAGGER: "false"
      SWAGGER_PATH: /api/docs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - production-network
    restart: unless-stopped
    # Resource limitations
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Nginx reverse proxy & frontend server
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
      args:
        VITE_API_URL: /api
        VITE_BASE_PATH: /
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: ilu-ase-production-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - production-network
    restart: unless-stopped
    # Resource limitations
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

volumes:
  postgres_production_data:
    driver: local
  redis_production_data:
    driver: local

networks:
  production-network:
    driver: bridge