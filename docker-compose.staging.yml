version: '3.8'

services:
  # PostgreSQL 16 - Production-like database
  postgres:
    image: postgres:16-alpine
    container_name: ilu-ase-staging-postgres
    environment:
      POSTGRES_DB: ilu_ase_staging
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"  # Non-standard port to avoid conflict with local dev
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d ilu_ase_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Redis - Cache & session store
  redis:
    image: redis:7-alpine
    container_name: ilu-ase-staging-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-staging_redis_change_me}
    ports:
      - "6380:6379"  # Non-standard port to avoid conflict with local dev
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Backend API - NestJS server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ilu-ase-staging-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://staging_user:${POSTGRES_PASSWORD:-staging_password_change_me}@postgres:5432/ilu_ase_staging?schema=public&connection_limit=10
      REDIS_URL: redis://:${REDIS_PASSWORD:-staging_redis_change_me}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-staging_jwt_secret_change_me_min_32_chars}
      JWT_EXPIRATION: 3600
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_staging}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_staging}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test_staging}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: staging
      SENTRY_TRACE_SAMPLE_RATE: 0.5
      LOG_LEVEL: info
      API_URL: http://backend:8080
      FRONTEND_URL: http://localhost:3000
      WEBSOCKET_URL: ws://localhost:8080
      WEBSOCKET_CORS_ORIGIN: http://localhost:3000
      ENABLE_SWAGGER: 'true'
      SWAGGER_PATH: /api/docs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - /app/backend/dist
    networks:
      - staging-network
    command: npm run start:prod
    restart: unless-stopped

  # Nginx reverse proxy & frontend server
  nginx:
    image: nginx:alpine
    container_name: ilu-ase-staging-nginx
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./docker/nginx.staging.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - staging-network
    restart: unless-stopped

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local

networks:
  staging-network:
    driver: bridge
