services:
  # PostgreSQL 16 - Production-like database
  postgres:
    image: postgres:16-alpine
    container_name: ilu-ase-staging-postgres
    environment:
      POSTGRES_DB: ilu_ase_staging
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"  # Non-standard port to avoid conflict with local dev
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d ilu_ase_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Redis - Cache & session store
  redis:
    image: redis:7-alpine
    container_name: ilu-ase-staging-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-staging_redis_change_me}
    ports:
      - "6380:6379"  # Non-standard port to avoid conflict with local dev
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Backend API - NestJS server
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ilu-ase-staging-backend
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://staging_user:${POSTGRES_PASSWORD:-staging_password_change_me}@postgres:5432/ilu_ase_staging?schema=public&connection_limit=10
      REDIS_URL: redis://:${REDIS_PASSWORD:-staging_redis_change_me}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-staging_jwt_secret_change_me_min_32_chars}
      JWT_EXPIRATION: 3600
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_staging}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_staging}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test_staging}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-staging_encrypt_key_32chars_ok!x}
      SENTRY_DSN: ${SENTRY_DSN:-https://placeholder@o0.ingest.sentry.io/0}
      SENTRY_ENVIRONMENT: staging
      SENTRY_TRACE_SAMPLE_RATE: "0.5"
      LOG_LEVEL: info
      API_URL: http://backend:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4040}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4040}
      WEBSOCKET_URL: ws://backend:8080
      WEBSOCKET_CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:4040}
      ENABLE_SWAGGER: "true"
      SWAGGER_PATH: /api/docs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - staging-network
    restart: unless-stopped

  # Nginx reverse proxy & frontend server (builds React inside Docker)
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile.staging
      args:
        VITE_API_URL: /api
        VITE_BASE_PATH: /
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: ilu-ase-staging-nginx
    ports:
      - "4040:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - staging-network
    restart: unless-stopped

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local

networks:
  staging-network:
    driver: bridge
